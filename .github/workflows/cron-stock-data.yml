name: Stock Data Refresh

on:
  schedule:
    # 14:00 UTC — market open (10am EDT)
    - cron: "0 14 * * 1-5"
    # Every 15 min during market hours (14:00-20:59 UTC = 10am-5pm EDT)
    - cron: "*/15 14-20 * * 1-5"
    # 22:00 UTC — after market close (6pm EDT)
    - cron: "0 22 * * 1-5"
    # 1:00 UTC — overnight full pipeline (charts + fundamentals)
    - cron: "0 1 * * 1-5"
  workflow_dispatch:  # allow manual trigger from Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch stock data
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}" \
            "${{ secrets.APP_URL }}/api/cron/fetch-stock-data?secret=${{ secrets.CRON_SECRET }}"
