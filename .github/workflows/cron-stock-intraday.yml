name: Stock Data — Intraday Refresh

on:
  schedule:
    - cron: '0,15,30,45 14-20 * * 1-5'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch stock data
        run: |
          RESPONSE=$(curl -sL --max-time 300 -w "\n%{http_code}" \
            "${{ secrets.APP_URL }}/api/cron/fetch-stock-data?secret=${{ secrets.CRON_SECRET }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP $HTTP_CODE"
          echo "$BODY" | head -20
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Stock data refresh failed with HTTP $HTTP_CODE"
            exit 1
          fi
