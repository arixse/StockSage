name: Daily Digest

on:
  schedule:
    # 13:00 UTC — daily AI digest (9am EDT, before market open)
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Run daily digest
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${{ secrets.APP_URL }}/api/cron/daily-digest?secret=${{ secrets.CRON_SECRET }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP $HTTP_CODE"
          echo "$BODY" | head -40
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Daily digest failed with HTTP $HTTP_CODE"
            exit 1
          fi
